<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Master Image</title>
        <link rel="stylesheet" type="text/css" href="../css/QRUpload.css">
    </head>
    <body>
        
        <header>
            <nav class="navbar">
                <div class="logo">
                    <img src="..\assets\images\logo.png">
                </div>
                <div class="navbar-buttons">
                </div>
            </nav>
        </header>

        <section class="content">

            <img src="../assets/images/qr-stars.png" alt="Stars Decoration" id="img-stars">

            <div id="qr-left">

                <section id="qr-text">
                    <img src="../assets/images/qr-heart-line.png" alt="Heart Line Decoration" id="img-heart-line">
                    <p>Please scan the QR to upload your photo</p>
                </section>

                <section id="qr-countdown">
                    
                    <img src="../assets/images/qr-countdown.png" alt="Countdown Decoration" id="img-countdown">
                    
                </section>
                
            </div>

            <div id="qr-right">
                <img src="../assets/images/qr-upper-right-corner.png" alt="Upper Right Corner Decoration" id="img-upper-right-corner">
                <img src="../assets/images/qr_code.svg" alt="No QR Code" id="img-qr-code">
                <img src="../assets/images/qr-bottom-left-corner.png" alt="Bottom Left Corner Decoration" id="img-bottom-left-corner">
            </div>

        </section>

    </body>
    <footer>
        <p>©2025. Grow A Thesis. All Rights Reserved.</p>
    </footer>
</html>
