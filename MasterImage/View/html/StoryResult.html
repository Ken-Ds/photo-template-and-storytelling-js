<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Photo - Master Image</title>
    <link rel="stylesheet" type="text/css" href="../css/Mobile.css">
    <link rel="stylesheet" type="text/css" href="../css/StoryResult.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="../assets/images/logo.png">
            </div>
        </nav>   
    </header>

    <main class="content">
        <div class="save-photo-wrapper">
            <div class="photo-frame">
                <div class="photo-container">
                    <img id="userPhoto" src="../assets/images/placeholder.jpg" alt="User Photo">
                    <div class="photo-overlay">
                        <span class="watermark">Image Placeholder</span>
                    </div>
                </div>
                <div class="photo-label">
                    <p id="userName">Ipsum Loren</p>
                </div>
            </div>

            <h2 class="save-question">Do you want to save your photo?</h2>

            <div class="save-buttons">
                <button class="save-btn no-btn" id="noBtn">No</button>
                <button class="save-btn yes-btn" id="yesBtn">Yes</button>
            </div>
        </div>
    </main>

    <footer>
        <p>©2025. Grow A Thesis. All Rights Reserved.</p>
    </footer>

    <script src="../js/StoryResult.js"></script>
</body>
</html>
