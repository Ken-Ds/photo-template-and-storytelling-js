<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Master Image</title>
        <link rel="stylesheet" type="text/css" href="../css/UploadSuccessfully.css"/>
    </head>
    <body>
        <header>
            <nav class="navbar">
                <div class="logo">
                    <img src="../assets/images/logo.png">
                </div>
            </nav>
        </header>
        <section class="content">
            <div class="uploaded-area">
                <img id='uploaded-img' src="../assets/images/pic-placeholder.png" >
            </div>
            <h2>Image Uploaded Successfully!</h2>
            <div class="USbuttons">
                <button id="nextUS" class="next" type="button">
                    Next
                    <img src="../assets/images/nextbtn.png" alt=""> 
                </button>
                <button id="cancelUS" class="cancel" type="button">
                    Cancel 
                    <img src="../assets/images/backbtn.png" alt=""> 
                </button>
            </div>
        </section>
        <footer>
            <p>©2025. Grow A Thesis. All Rights Reserved.</p>
        </footer>
    </body>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const imageName = params.get('image');
    
        if (imageName) {
            document.getElementById('uploaded-img').src = '../assets/uploads/' + imageName;
        }
    </script>
</html>
