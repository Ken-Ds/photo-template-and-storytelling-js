<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Already In Use - Master Image</title>
    <link rel="stylesheet" type="text/css" href="../css/Mobile.css">
    <link rel="stylesheet" type="text/css" href="../css/MobileAlertPopup.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="../assets/images/logo.png">
            </div>
        </nav>   
    </header>

    <main class="content">
        <div class="qr-page-wrapper">
            <div class="qr-message-container">
                <h1 class="qr-page-title">QR ALREADY IN USE</h1>
                
                <p class="qr-page-message">
                    Sorry, the QR code is already in use. Please wait for the current user to finish to create a new QR code.
                </p>
                
                <div class="qr-page-icon">
                    <div class="qr-page-monitor">
                        <div class="qr-page-monitor-screen">
                            <div class="qr-page-error-text">ERROR</div>
                            <div class="qr-page-error-symbol">✖</div>
                            <div class="qr-page-error-text">ERROR</div>
                            <div class="qr-page-error-symbol">✖</div>
                            <div class="qr-page-error-text">ERROR</div>
                        </div>
                        <div class="qr-page-monitor-stand"></div>
                        <div class="qr-page-monitor-base"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>©2025. Grow A Thesis. All Rights Reserved.</p>
    </footer>

    <script src="../js/MobileAlertPopup.js"></script>
</body>
</html>
