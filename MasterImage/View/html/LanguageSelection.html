<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Selection - Master Image</title>
    <link rel="stylesheet" type="text/css" href="../css/Mobile.css">
    <link rel="stylesheet" type="text/css" href="../css/LanguageSelection.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="../assets/images/logo.png">
            </div>
        </nav>   
    </header>

    <main class="content">
        <div class="language-wrapper">
            <h1 class="language-title">Choose what language to use</h1>
            
            <div class="language-buttons" style="margin-top: -10rem;">
                <button class="lang-btn lang-english selected" data-lang="english">
                    English
                </button>
                <button class="lang-btn lang-bontok" data-lang="bontok">
                    Bontok
                </button>
            </div>

            <div class="navigation-buttons">
                <button class="nav-btn back-btn" id="backBtn">
                    <img src="../assets/images/backbtn.png" alt="Back arrow">
                    Back
                </button>
                <button class="nav-btn next-btn" id="nextBtn">
                    Next
                    <img src="../assets/images/nextbtn.png" alt="Next arrow">
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>©2025. Grow A Thesis. All Rights Reserved.</p>
    </footer>

    <script src="../js/LanguageSelection.js"></script>
</body>
</html>
