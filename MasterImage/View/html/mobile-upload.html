<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Master Image</title>
        <link rel="stylesheet" type="text/css" href="../css/mobile-upload.css"
    </head>
    <body>
        <header>
            <nav class="navbar">
                <div class="logo">
                    <img src="..\assets\images\logo.png">
                </div>
            </nav>   
        </header>
    
        <main class="content">
    
            <div class="main-wrapper">
                <div class="page-title">
                    Upload Your Photo Here
                </div>
                <div class="MUupload">
                    <div class="upload-area">
                        <img src="../assets/images/upload.png" accept="image/png, image/jpeg">
                        <p>Tap to select from Gallery or Camera.
                        <br>.PNG, .JPEG, .JPG up to 10MB</p>
                    </div>
                </div>
        
                <div class="MUbuttons">
                    <button id="submitMU" class="submit" type="button">
                        Submit
                        <img src="../assets/images/nextbtn.png" alt=""> 
                    </button>
                    <button id="cancelMU" class="cancel" type="button">
                        Cancel 
                    </button>
                </div>
            </div>
        </main>
    </body>

    <script>

    </script>
</html>
